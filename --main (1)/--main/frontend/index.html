    /**
     * Resize & compress local image File via HTML5 Canvas (max 640px, JPEG 0.75)
     */
    function compressImageToDataUrl(file, maxSize = 640, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("이미지 파일을 읽을 수 없습니다."));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error("지원하지 않는 이미지 형식입니다."));
          img.onload = () => {
            let { width, height } = img;
            if (width > maxSize || height > maxSize) {
              if (width >= height) {
                height = Math.round((height * maxSize) / width);
                width = maxSize;
              } else {
                width = Math.round((width * maxSize) / height);
                height = maxSize;
              }
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

      const u = mockDB.users.find((item) => item.user_id === Number(user_id));

      const vers = mockDB.user_neighborhood
        .filter((v) => v.user_id === u.user_id)
        .sort((a, b) => new Date(b.verified_at) - new Date(a.verified_at));
      const latest = vers[0] || null;
      const nb = latest
        ? mockDB.neighborhoods.find((n) => n.neighborhood_id === latest.neighborhood_id)
        : null;
      return {
        user_id: u.user_id,
        nickname: u.nickname,
        phone_num: u.phone_num,
        neighborhood_id: latest ? latest.neighborhood_id : null,
        neighborhood_name: nb ? nb.neighborhood_name : null,
        region_info: nb ? nb.region_info : null,
        is_verified: Boolean(latest && latest.verification_status === "인증완료"),
      };
    }

    function loadMockChats() {
      const shared = JSON.parse(localStorage.getItem(MOCK_CHAT_KEY) || "null");
      if (!shared) return;
      for (const table of MOCK_CHAT_TABLES) mockDB[table] = shared[table];
      for (const post of mockDB.product_post) {
        if (shared.postStatuses[post.post_id]) post.status = shared.postStatuses[post.post_id];
      }
    }

    function saveMockChats() {
      const shared = Object.fromEntries(MOCK_CHAT_TABLES.map((table) => [table, mockDB[table]]));
      shared.postStatuses = Object.fromEntries(mockDB.product_post.map((post) => [post.post_id, post.status]));
      localStorage.setItem(MOCK_CHAT_KEY, JSON.stringify(shared));
      refreshChats();
    }

    async function apiFetch(path, options = {}) {
      try {
        const res = await fetch(`${API_BASE}${path}`, {
          ...options,
          headers: { "Content-Type": "application/json", ...options.headers },
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const error = new Error(typeof data.detail === "string" && data.detail.trim()
            ? data.detail : `요청 처리에 실패했습니다. (HTTP ${res.status})`);
          error.status = res.status;
          throw error;
        }
        return data;
      } catch (err) {
        if (err instanceof TypeError || err.message === "Failed to fetch") {
          throw new Error("백엔드 서버(127.0.0.1:8000)에 연결할 수 없어요. FastAPI 서버 실행 상태를 확인해 주세요.");
        }
        throw err;
      }
    }

    const api = {

          return apiFetch("/api/signup", {
            method: "POST",
            body: JSON.stringify({ phone_num, password, nickname }),
          });

        if (mockDB.users.some((u) => u.phone_num === cleaned)) {
          throw new Error("이미 가입된 전화번호입니다.");
        }
        const user_id = Math.max(0, ...mockDB.users.map((u) => u.user_id)) + 1;
        mockDB.users.push({ user_id, phone_num: cleaned, password, nickname: nickname.trim() });
        return { message: "회원가입 성공", user: mockGetUserProfile(user_id) };

      async login({ phone_num, password }) {

          });

          (u) => u.phone_num === phone_num.trim() && u.password === password

      async getNeighborhoods() {

          return apiFetch("/api/neighborhoods");

      async verifyNeighborhood({ user_id, neighborhood_id }) {

      // 6. GET /api/posts
      async getPosts({ neighborhood_id, status, q, seller_id, user_id } = {}) {
        if (!USE_MOCK) {
          const params = new URLSearchParams();
          if (neighborhood_id !== null && neighborhood_id !== undefined && neighborhood_id !== "") {
            params.set("neighborhood_id", String(neighborhood_id));
          }
          if (status && status !== "전체") {
            params.set("status", status);
          }
          if (q && q.trim()) {
            params.set("q", q.trim());
          }
          if (seller_id !== null && seller_id !== undefined && seller_id !== "") {
            params.set("seller_id", String(seller_id));
          }
          if (user_id !== null && user_id !== undefined && user_id !== "") {
            params.set("user_id", String(user_id));
          }
          const qs = params.toString();
          return apiFetch(`/api/posts${qs ? `?${qs}` : ""}`);
        }
        let rows = [...mockDB.product_post].sort(
          (a, b) => new Date(b.post_created) - new Date(a.post_created)
        );
        if (neighborhood_id !== null && neighborhood_id !== undefined && neighborhood_id !== "") {
          rows = rows.filter((p) => p.neighborhood_id === Number(neighborhood_id));
        }
        if (status && status !== "전체") {
          rows = rows.filter((p) => p.status === status);
        }
        if (seller_id !== null && seller_id !== undefined && seller_id !== "") {
          rows = rows.filter((p) => p.user_id === Number(seller_id));
        }
        if (q && q.trim()) {
          const kw = q.trim().toLowerCase();
          rows = rows.filter(
            (p) =>
              p.post_title.toLowerCase().includes(kw) ||
              (p.description || "").toLowerCase().includes(kw)
          );
        }
        return rows.map((p) => mockEnrichPost(p, user_id));

      async updatePostStatus(post_id, status) {

      // 9-1. DELETE /api/posts/{post_id}?user_id={user_id}
      async deletePost(post_id, user_id) {
        if (!USE_MOCK) {
          return apiFetch(`/api/posts/${post_id}?user_id=${encodeURIComponent(user_id)}`, {
            method: "DELETE",
          });
        }
        loadMockChats();
        const pid = Number(post_id);
        const uid = Number(user_id);
        const idx = mockDB.product_post.findIndex((p) => p.post_id === pid);
        if (idx === -1) throw new Error("게시글을 찾을 수 없습니다.");
        if (mockDB.product_post[idx].user_id !== uid) {
          throw new Error("본인이 작성한 게시글만 삭제할 수 있습니다.");
        }
        mockDB.product_post.splice(idx, 1);
        mockDB.product_image = mockDB.product_image.filter((img) => img.post_id !== pid);
        mockDB.wishlist = mockDB.wishlist.filter((w) => w.post_id !== pid);
        mockDB.reservation_info = mockDB.reservation_info.filter((r) => r.post_id !== pid);
        const removedRoomIds = mockDB.chatroom
          .filter((r) => r.post_id === pid)
          .map((r) => r.chatroom_id);
        mockDB.chatroom = mockDB.chatroom.filter((r) => r.post_id !== pid);
        if (removedRoomIds.length > 0) {
          mockDB.chat_participant = mockDB.chat_participant.filter(
            (p) => !removedRoomIds.includes(p.chatroom_id)
          );
          mockDB.chat_message = mockDB.chat_message.filter(
            (m) => !removedRoomIds.includes(m.chatroom_id)
          );
        }
        saveMockChats();
        return { message: "게시글 삭제 완료", post_id: pid };
      },

      async getWishlist(user_id) {
        if (!USE_MOCK) {
          return apiFetch(`/api/wishlist/${user_id}`);
        }
        const myWishes = mockDB.wishlist
          .filter((w) => w.user_id === Number(user_id))
          .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        return myWishes
          .map((w) => {
            const p = mockDB.product_post.find((item) => item.post_id === w.post_id);
            return p ? mockEnrichPost(p, user_id) : null;
          })
          .filter(Boolean);
      },

      // 11. POST /api/wishlist/toggle
      async toggleWishlist({ user_id, post_id }) {
        if (!USE_MOCK) {
          return apiFetch("/api/wishlist/toggle", {
            method: "POST",
            body: JSON.stringify({ user_id, post_id }),
          });
        }
        const idx = mockDB.wishlist.findIndex(
          (w) => w.user_id === Number(user_id) && w.post_id === Number(post_id)
        );
        let wished = false;
        if (idx >= 0) {
          mockDB.wishlist.splice(idx, 1);
          wished = false;
        } else {
          const wishlist_id = Math.max(0, ...mockDB.wishlist.map((w) => w.wishlist_id)) + 1;
          mockDB.wishlist.push({
            wishlist_id,
            created_at: new Date().toISOString(),
            user_id: Number(user_id),
            post_id: Number(post_id),
          });
          wished = true;
        }
        const wish_count = mockDB.wishlist.filter((w) => w.post_id === Number(post_id)).length;
        return { wished, wish_count };
      },

          reservation_id,
          reservation_at: reservation_at || new Date().toISOString(),

          user_id: Number(user_id),
        };
        mockDB.reservation_info.push(reservation);

        return { message: "예약 제안 완료", reservation };

      // 13. PATCH /api/reservations/{reservation_id}
      async updateReservation(reservation_id, reservation_status) {
        if (!USE_MOCK) {
          return apiFetch(`/api/reservations/${reservation_id}`, {
            method: "PATCH",
            body: JSON.stringify({ reservation_status }),
          });
        }
        loadMockChats();
        const target = mockDB.reservation_info.find(
          (r) => r.reservation_id === Number(reservation_id)
        );
        if (!target) throw new Error("예약 정보를 찾을 수 없습니다.");
        target.reservation_status = reservation_status;
        if (reservation_status === "예약취소") {
          target.canceled_at = new Date().toISOString();
        }
        const syncMap = { 예약확정: "예약중", 예약취소: "판매중", 거래완료: "거래완료" };
        const post_status = syncMap[reservation_status] || null;
        if (post_status) {
          const post = mockDB.product_post.find((p) => p.post_id === target.post_id);
          if (post) post.status = post_status;
        }
        saveMockChats();
        return { message: `${reservation_status} 처리 완료`, reservation: target, post_status };
      },

      // 14. GET /api/reservations/{user_id}
      async getUserReservations(user_id) {
        if (!USE_MOCK) {
          return apiFetch(`/api/reservations/${user_id}`);
        }
        loadMockChats();
        const uid = Number(user_id);
        const myPostIds = mockDB.product_post.filter((p) => p.user_id === uid).map((p) => p.post_id);
        const matched = mockDB.reservation_info
          .filter((r) => r.user_id === uid || myPostIds.includes(r.post_id))
          .sort((a, b) => new Date(b.reservation_at) - new Date(a.reservation_at));
        return matched.map((r) => {
          const buyer = mockDB.users.find((u) => u.user_id === r.user_id);
          const post = mockDB.product_post.find((p) => p.post_id === r.post_id);
          return {
            ...r,
            buyer_nickname: buyer ? buyer.nickname : "알 수 없음",
            post: post ? mockEnrichPost(post, uid) : null,
          };
        });
      },

      // 15. POST /api/chatrooms
      async getOrCreateChatroom({ post_id, buyer_id }) {
        if (!USE_MOCK) {
          return apiFetch("/api/chatrooms", {
            method: "POST",
            body: JSON.stringify({ post_id, buyer_id }),
          });
        }
        loadMockChats();
        const post = mockDB.product_post.find((p) => p.post_id === Number(post_id));
        if (!post) throw new Error("게시글을 찾을 수 없습니다.");
        if (post.user_id === Number(buyer_id)) {
          throw new Error("본인의 게시글에는 채팅방을 만들 수 없습니다.");
        }
        const existingRoom = mockDB.chatroom.find((r) => {
          if (r.post_id !== Number(post_id)) return false;
          const uids = mockDB.chat_participant
            .filter((p) => p.chatroom_id === r.chatroom_id)
            .map((p) => p.user_id);
          return uids.includes(Number(buyer_id));
        });
        if (existingRoom) {
          return { message: "기존 채팅방 입장", chatroom_id: existingRoom.chatroom_id };
        }
        const chatroom_id = Math.max(Date.now(), ...mockDB.chatroom.map((r) => r.chatroom_id + 1));
        mockDB.chatroom.push({
          chatroom_id,
          chat_created: new Date().toISOString(),
          post_id: Number(post_id),
        });
        let pid = Math.max(0, ...mockDB.chat_participant.map((p) => p.participant_id)) + 1;
        mockDB.chat_participant.push({ participant_id: pid++, user_id: post.user_id, chatroom_id });
        mockDB.chat_participant.push({ participant_id: pid++, user_id: Number(buyer_id), chatroom_id });
        saveMockChats();
        return { message: "새 채팅방 생성 완료", chatroom_id };
      },

      async deleteChatroom(chatroomId, user) {
        if (!USE_MOCK) {
          return apiFetch(`/api/chatrooms/${chatroomId}`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${user.chat_session || ""}` },
          });
        }
        loadMockChats();
        mockDB.chatroom = mockDB.chatroom.filter((room) => room.chatroom_id !== chatroomId);
        mockDB.chat_participant = mockDB.chat_participant.filter((part) => part.chatroom_id !== chatroomId);
        mockDB.chat_message = mockDB.chat_message.filter((message) => message.chatroom_id !== chatroomId);
        saveMockChats();
      },

      // 16. GET /api/chatrooms/{user_id}
      async getChatrooms(user_id) {
        if (!USE_MOCK) {
          return apiFetch(`/api/chatrooms/${user_id}`);
        }
        loadMockChats();
        const uid = Number(user_id);
        const roomIds = mockDB.chat_participant
          .filter((p) => p.user_id === uid)
          .map((p) => p.chatroom_id);
        return roomIds
          .map((cid) => {
            const room = mockDB.chatroom.find((r) => r.chatroom_id === cid);
            if (!room) return null;
            const post = mockDB.product_post.find((p) => p.post_id === room.post_id);
            const parts = mockDB.chat_participant.filter((p) => p.chatroom_id === cid);
            const partnerPart = parts.find((p) => p.user_id !== uid);
            const partner = partnerPart
              ? mockDB.users.find((u) => u.user_id === partnerPart.user_id)
              : null;
            const msgs = mockDB.chat_message
              .filter((m) => m.chatroom_id === cid)
              .sort((a, b) => new Date(b.sent_at) - new Date(a.sent_at));
            const lastMsg = msgs[0] || null;
            const buyerId = parts.find((part) => part.user_id !== post?.user_id)?.user_id;
            const resList = mockDB.reservation_info
              .filter((r) => r.post_id === room.post_id && r.user_id === buyerId)
              .sort((a, b) => b.reservation_id - a.reservation_id);
            return {
              chatroom_id: cid,
              post_id: room.post_id,
              chat_created: room.chat_created,
              partner_id: partner ? partner.user_id : null,
              partner_nickname: partner ? partner.nickname : "알 수 없음",
              post: post ? mockEnrichPost(post, uid) : null,
              last_message: lastMsg ? lastMsg.content : "대화를 시작해 보세요.",
              last_sent_at: lastMsg ? lastMsg.sent_at : room.chat_created,
              last_received_message_id: msgs.find((m) => m.user_id !== uid)?.message_id || 0,
              latest_reservation: resList[0] || null,
            };
          })
          .filter(Boolean)
          .sort((a, b) => new Date(b.last_sent_at) - new Date(a.last_sent_at));
      },

      // 17. GET /api/chatrooms/{chatroom_id}/messages
      async getChatMessages(chatroom_id) {
        if (!USE_MOCK) {
          return apiFetch(`/api/chatrooms/${chatroom_id}/messages`);
        }
        loadMockChats();
        const room = mockDB.chatroom.find((r) => r.chatroom_id === Number(chatroom_id));
        if (!room) throw Object.assign(new Error("채팅방을 찾을 수 없습니다."), { status: 404 });
        const post = mockDB.product_post.find((p) => p.post_id === room.post_id);
        const buyerId = mockDB.chat_participant.find((part) =>
          part.chatroom_id === room.chatroom_id && part.user_id !== post?.user_id)?.user_id;
        const msgs = mockDB.chat_message
          .filter((m) => m.chatroom_id === room.chatroom_id)
          .sort((a, b) => new Date(a.sent_at) - new Date(b.sent_at))
          .map((m) => {
            const sender = mockDB.users.find((u) => u.user_id === m.user_id);
            return { ...m, sender_nickname: sender ? sender.nickname : "알 수 없음" };
          });
        const resList = mockDB.reservation_info
          .filter((r) => r.post_id === room.post_id && r.user_id === buyerId)
          .sort((a, b) => b.reservation_id - a.reservation_id);
        return {
          chatroom_id: room.chatroom_id,
          post: post ? mockEnrichPost(post) : null,
          buyer_id: buyerId,
          latest_reservation: resList[0] || null,
          messages: msgs,
        };
      },

      // 18. POST /api/chatrooms/{chatroom_id}/messages
      async sendChatMessage(chatroom_id, { user_id, content }) {
        if (!USE_MOCK) {
          return apiFetch(`/api/chatrooms/${chatroom_id}/messages`, {
            method: "POST",
            body: JSON.stringify({ user_id, content }),
          });
        }
        loadMockChats();
        if (!mockDB.chatroom.some((room) => room.chatroom_id === Number(chatroom_id))) {
          throw new Error("채팅방을 찾을 수 없습니다.");
        }
        const message_id = Math.max(Date.now(), ...mockDB.chat_message.map((m) => m.message_id + 1));
        const sender = mockDB.users.find((u) => u.user_id === Number(user_id));
        const saved = {
          message_id,
          content: content.trim(),
          sent_at: new Date().toISOString(),
          chatroom_id: Number(chatroom_id),
          user_id: Number(user_id),
          sender_nickname: sender ? sender.nickname : "알 수 없음",
        };
        mockDB.chat_message.push(saved);
        saveMockChats();
        return saved;
      },
    };

    /* =========================================================================
       5. APPLICATION STATE & SESSION STORAGE PERSISTENCE
       ========================================================================= */
    function loadSessionUser() {
      try {
        const raw = sessionStorage.getItem(SESSION_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function saveSessionUser(user) {
      try {
        if (user) {
          sessionStorage.setItem(SESSION_KEY, JSON.stringify(user));
        } else {
          sessionStorage.removeItem(SESSION_KEY);
        }
      } catch (e) {
        console.warn("sessionStorage unavailable:", e);
      }
    }

    function loadPostDraft() {
      try {
        const raw = localStorage.getItem(DRAFT_KEY);
        if (!raw) return { title: "", price: "", description: "", images: [] };
        const parsed = JSON.parse(raw);
        return {
          title: parsed.title || "",
          price: parsed.price || "",
          description: parsed.description || "",
          images: Array.isArray(parsed.images) ? parsed.images : [],
        };
      } catch {
        return { title: "", price: "", description: "", images: [] };
      }
    }

    const state = {
      screen: "auth", // auth | verify | home | create | detail | chats | chatroom | wishlist | mypage | my_sales | my_reservations
      prevScreen: "home",
      currentUser: loadSessionUser(),

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function hasBatchim(word) {
      if (!word) return false;
      const code = word.charCodeAt(word.length - 1);
      if (code < 0xac00 || code > 0xd7a3) return false;
      return (code - 0xac00) % 28 !== 0;
    }

    function withSubjectParticle(word) {
      return `${word}${hasBatchim(word) ? "이" : "가"}`;
    }

    function withDirectionParticle(word) {
      if (!word) return "";
      const code = word.charCodeAt(word.length - 1);
      if (code >= 0xac00 && code <= 0xd7a3) {
        const jong = (code - 0xac00) % 28;
        // ㄹ 받침(8) 또는 받침 없음(0) -> '로'
        return `${word}${jong === 0 || jong === 8 ? "로" : "으로"}`;
      }
      return `${word}으로`;
    }

    function formatPhoneInput(raw) {
      const digits = raw.replace(/\D/g, "").slice(0, 11);
      if (digits.length <= 3) return digits;
      if (digits.length <= 7) return `${digits.slice(0, 3)}-${digits.slice(3)}`;
      return `${digits.slice(0, 3)}-${digits.slice(3, 7)}-${digits.slice(7)}`;
    }

    function formatPrice(num) {
      return `${Number(num || 0).toLocaleString("ko-KR")}원`;
    }

    function formatRelativeTime(iso) {
      if (!iso) return "";
      const diffSec = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
      if (diffSec < 60) return "방금 전";
      const min = Math.floor(diffSec / 60);
      if (min < 60) return `${min}분 전`;
      const hr = Math.floor(min / 60);
      if (hr < 24) return `${hr}시간 전`;
      const day = Math.floor(hr / 24);
      return day === 1 ? "어제" : `${day}일 전`;
    }

    function formatChatTime(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    }

    function formatChatListTime(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      const diffHours = (Date.now() - d.getTime()) / 3600000;
      if (diffHours >= 48) {
        return `${d.getMonth() + 1}월 ${d.getDate()}일`;
      }
      if (diffHours >= 24) return "어제";
      const h = d.getHours();
      const ampm = h >= 12 ? "오후" : "오전";
      const h12 = h % 12 === 0 ? 12 : h % 12;
      return `${ampm} ${h12}:${String(d.getMinutes()).padStart(2, "0")}`;
    }

    function formatReservationDate(iso) {
      if (!iso) return "시간 미정";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return String(iso);
      const days = ["일", "월", "화", "수", "목", "금", "토"];
      const now = new Date();
      const isToday =
        d.getFullYear() === now.getFullYear() &&
        d.getMonth() === now.getMonth() &&
        d.getDate() === now.getDate();
      const tomorrow = new Date(now);
      tomorrow.setDate(now.getDate() + 1);
      const isTomorrow =
        d.getFullYear() === tomorrow.getFullYear() &&
        d.getMonth() === tomorrow.getMonth() &&
        d.getDate() === tomorrow.getDate();

      const h = d.getHours();
      const ampm = h >= 12 ? "오후" : "오전";
      const h12 = h % 12 === 0 ? 12 : h % 12;
      const min = String(d.getMinutes()).padStart(2, "0");

      if (isToday) return `오늘 ${ampm} ${h12}:${min}`;
      if (isTomorrow) return `내일 ${ampm} ${h12}:${min}`;
      return `${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]}) ${ampm} ${h12}:${min}`;
    }

    function formatChatDateDivider(iso) {
      const d = iso ? new Date(iso) : new Date();
      const days = ["일", "월", "화", "수", "목", "금", "토"];

      panel.setAttribute("role", "dialog");
      panel.setAttribute("aria-modal", "true");
      panel.tabIndex = -1;
      const heading = panel.querySelector("h2, h3");
      if (heading) {
        heading.id ||= "modal-heading";
        panel.setAttribute("aria-labelledby", heading.id);
      } else {
        panel.setAttribute("aria-label", "메뉴");
      }
      modalRoot.hidden = false;
      panel.focus();
      modalRoot.onclick = (e) => {
        if (e.target === modalRoot) closeModal();
      };
    }

    let chatSocket = null;
    let chatConnected = false;
    let rejectedChatSession = null;
    let chatRooms = [];
    let chatListRequest = 0;
    let updateChatList = null;
    let syncOpenChat = null;
    let lastChatSync = 0;

    function chatReadKey(roomId) {
      return `dongne_chat_read:${USE_MOCK ? "demo" : "server"}:${state.currentUser.user_id}:${roomId}`;
    }

    function isUnread(room) {
      return room.last_received_message_id > Number(localStorage.getItem(chatReadKey(room.chatroom_id)) || 0);
    }

    function markChatRead(roomId, messages) {
      const key = chatReadKey(roomId);
      const previous = Number(localStorage.getItem(key) || 0);
      const latest = messages.reduce((id, message) => message.user_id === state.currentUser.user_id
        ? id : Math.max(id, message.message_id), previous);
      if (latest > previous) localStorage.setItem(key, String(latest));
    }

    function renderChatBadge() {
      const badge = document.getElementById("chat-nav-badge");
      if (!badge || !state.currentUser) return;
      const count = chatRooms.filter(isUnread).length;
      badge.hidden = count === 0;
      badge.textContent = count > 99 ? "99+" : String(count);
      badge.parentElement.setAttribute("aria-label", count ? `채팅, 읽지 않은 대화 ${count}개` : "채팅");
    }

    async function refreshChats() {
      const userId = state.currentUser?.user_id;
      if (!userId) return;
      const request = ++chatListRequest;
      try {
        const rooms = await api.getChatrooms(userId);
        if (request !== chatListRequest || state.currentUser?.user_id !== userId) return;
        chatRooms = rooms;
        renderChatBadge();
        updateChatList?.(rooms);
      } catch (error) {
        if (request === chatListRequest) updateChatList?.(null, error);
      }
    }

    function chatConnectionLabel() {
      if (USE_MOCK) return "데모 채팅";
      return chatConnected ? "실시간 채팅 연결됨" : "자동 새로고침 중";
    }

    function handleChatUpdate(event) {
      syncOpenChat?.(event);
      refreshChats();
    }

    function connectChatUpdates() {
      const session = state.currentUser?.chat_session;
      if (USE_MOCK || !session || chatSocket || session === rejectedChatSession) return;

      const socket = new WebSocket(`${WS_BASE}/ws/chat-updates`);
      chatSocket = socket;
      socket.onopen = () => {
        if (chatSocket === socket) socket.send(session);
      };
      socket.onmessage = ({ data }) => {
        if (chatSocket !== socket) return;
        const event = JSON.parse(data);
        if (event.type === "ready") chatConnected = true;
        handleChatUpdate(event);
      };
      socket.onclose = (event) => {
        if (chatSocket !== socket) return;
        if (event.code === 1008) rejectedChatSession = session;
        chatSocket = null;
        chatConnected = false;
        handleChatUpdate({ type: "refresh" });
      };
    }

    function resetChatUpdates() {
      const socket = chatSocket;
      chatSocket = null;
      socket?.close();
      chatConnected = false;
      chatRooms = [];
      chatListRequest++;
      lastChatSync = 0;
    }

    function pollChatUpdates() {
      if (!state.currentUser) return;
      connectChatUpdates();
      if (Date.now() - lastChatSync < (chatConnected ? 30000 : 4000)) return;
      lastChatSync = Date.now();
      handleChatUpdate({ type: "refresh" });
    }

    window.addEventListener("storage", (event) => {
      if (!state.currentUser) return;
      if (USE_MOCK && event.key === MOCK_CHAT_KEY) handleChatUpdate({ type: "refresh" });
      if (event.key?.startsWith("dongne_chat_read:")) {
        renderChatBadge();
        updateChatList?.(chatRooms);
      }
    });

    function navigate(nextScreen, params = {}) {
      closeModal();
      syncOpenChat = null;
      updateChatList = null;
      if (state.screen !== nextScreen) {
        state.prevScreen = state.screen;
      }
      if (params.postId !== undefined) state.activePostId = params.postId;
      if (params.chatroomId !== undefined) state.activeChatroomId = params.chatroomId;
      if (params.partnerId !== undefined) state.activePartnerId = params.partnerId;
      if (params.partnerNickname !== undefined) state.activePartnerNickname = params.partnerNickname;
      if (params.authTab !== undefined) state.authTab = params.authTab;

      state.screen = nextScreen;
      renderApp();
      pollChatUpdates();
    }

          showToast("사진은 최대 5장까지 등록할 수 있어요.", "error");

            const compressed = await compressImageToDataUrl(file, 640, 0.75);

          const res = await api.toggleWishlist({
            user_id: state.currentUser.user_id,
            post_id: post.post_id,
          });
          post.is_wished = res.wished;
          post.wish_count = res.wish_count;
          const icon = document.getElementById("detail-wish-icon");
          icon.classList.toggle("fill-primary", res.wished);
          icon.classList.toggle("text-primary", res.wished);
          icon.classList.toggle("text-ink", !res.wished);
          document.getElementById("detail-meta-stats").textContent = `관심 ${res.wish_count} · 채팅 ${post.chat_count ?? 0}`;
          showToast(res.wished ? "관심목록에 담았어요." : "관심목록에서 해제했어요.");
        } catch (err) {
          showToast(err.message, "error");
        }
      });

      document.getElementById("detail-start-chat")?.addEventListener("click", async () => {
        try {
          const res = await api.getOrCreateChatroom({
            post_id: post.post_id,
            buyer_id: state.currentUser.user_id,
          });
          navigate("chatroom", {
            chatroomId: res.chatroom_id,
            partnerId: post.user_id,
            partnerNickname: post.seller_nickname,
          });
        } catch (err) {
          showToast(err.message, "error");
        }
      });
    }

    /**
     * [06] 채팅 목록
     */
    async function renderChatsScreen(root) {
      root.innerHTML = `
        <div class="flex-1 flex flex-col min-h-0 bg-white">
          <header class="flex-none h-[56px] px-5 flex items-center justify-between">
            <h1 class="text-[19px] font-bold text-ink">채팅</h1>
            <button type="button" id="refresh-chats-btn" class="text-[12px] font-bold text-primary hover:underline">새로고침</button>
          </header>
          <div id="chats-body" class="flex-1 flex flex-col min-h-0">
            <div class="py-16 text-center text-[13px] text-muted">채팅 목록을 불러오는 중...</div>
          </div>
        </div>
      `;

      const body = document.getElementById("chats-body");
      updateChatList = (rooms, error) => {
        if (!body.isConnected) return;
        if (rooms) {
          const scrollTop = body.lastElementChild?.scrollTop || 0;
          body.innerHTML = `
            <div class="flex-none px-[18px] pb-3">
              <p class="text-[14px] text-muted">참여 중인 채팅방 ${rooms.length}</p>
            </div>
            <div class="flex-1 overflow-y-auto px-[18px] pb-5 divide-y divide-border">
              ${
                rooms.length === 0
                  ? `
                  <div class="py-20 text-center flex flex-col items-center">
                    <p class="text-[15px] font-bold text-ink">참여 중인 채팅방이 없어요</p>
                    <p class="mt-1 text-[12px] text-muted">마음에 드는 상품에서 '채팅으로 거래하기'를 눌러보세요.</p>
                  </div>
                `
                  : rooms
                      .map((room) => {
                        const resStatus = room.latest_reservation?.reservation_status;
                        const resBadge =
                          resStatus === "예약대기"
                            ? `<span class="inline-flex px-2 py-0.5 rounded-[6px] bg-primary-soft text-primary text-[11px] font-bold">예약대기</span>`
                            : resStatus === "예약확정"
                            ? `<span class="inline-flex px-2 py-0.5 rounded-[6px] bg-reserved-bg text-reserved-text text-[11px] font-bold">예약확정</span>`
                            : resStatus === "거래완료"
                            ? `<span class="inline-flex px-2 py-0.5 rounded-[6px] bg-surface-muted text-muted text-[11px] font-bold">거래완료</span>`
                            : "";
                        return `
                          <div
                            data-open-room="${room.chatroom_id}"
                            data-partner-id="${room.partner_id ?? ""}"
                            data-partner-name="${escapeHtml(room.partner_nickname)}"
                            class="cursor-pointer py-3.5 flex items-start gap-3.5 hover:bg-surface-muted/50 transition-colors"
                          >
                            <div class="w-[64px] h-[64px] rounded-[12px] overflow-hidden flex-none border border-border/70">
                              ${renderImageBox(room.post?.thumbnail, room.post?.post_title || "상품")}
                            </div>
                            <div class="flex-1 min-w-0 flex flex-col">
                              <div class="flex items-center justify-between gap-2">
                                <span class="text-[15px] font-bold text-ink truncate">${escapeHtml(room.partner_nickname)}</span>
                                <span class="text-[10px] text-muted flex-none">${formatChatListTime(room.last_sent_at)}</span>
                              </div>
                              <span class="text-[11px] text-muted truncate mt-0.5">${escapeHtml(room.post?.post_title || "")}</span>
                              <div class="flex items-center gap-2 mt-1">
                                <p class="text-[13px] text-ink truncate">${escapeHtml((room.last_message || "").replace(/\n/g, " "))}</p>
                                ${isUnread(room) ? `<span class="flex-none rounded-full bg-danger px-1.5 py-0.5 text-[10px] font-bold text-white">새 메시지</span>` : ""}
                              </div>
                              ${resBadge ? `<div class="mt-1.5">${resBadge}</div>` : ""}
                            </div>
                            <button type="button" data-delete-room="${room.chatroom_id}" aria-label="${escapeHtml(room.partner_nickname)}님과의 채팅방 삭제" class="flex-none rounded-lg px-2 py-1 text-[11px] font-bold text-danger hover:bg-danger-soft">삭제</button>
                          </div>
                        `;
                      })
                      .join("")
              }
            </div>
          `;

          body.querySelectorAll("[data-open-room]").forEach((row) => {
            row.addEventListener("click", () =>
              navigate("chatroom", {
                chatroomId: Number(row.dataset.openRoom),
                partnerId: row.dataset.partnerId ? Number(row.dataset.partnerId) : null,
                partnerNickname: row.dataset.partnerName,
              })
            );
          });
          body.lastElementChild.scrollTop = scrollTop;
          body.querySelectorAll("[data-delete-room]").forEach((button) => {
            button.addEventListener("click", (event) => {
              event.stopPropagation();
              openDeleteChatModal(Number(button.dataset.deleteRoom));
            });
          });
        } else if (!body.querySelector("[data-open-room]")) {
          body.innerHTML = `
            <div class="py-16 px-6 text-center">
              <p class="text-[14px] font-bold text-[#B91C1C]">채팅 목록을 불러오지 못했어요</p>
              <p class="mt-1 text-[12px] text-muted">${escapeHtml(error.message)}</p>
            </div>
          `;
        }
      };

      document.getElementById("refresh-chats-btn").addEventListener("click", refreshChats);
      await refreshChats();
    }

    function openDeleteChatModal(roomId) {
      openModal(`
        <div class="w-full max-w-[390px] rounded-t-[20px] p-5 flex flex-col gap-4 shadow-2xl">
          <h3 class="text-[17px] font-bold text-ink">채팅방을 삭제할까요?</h3>
          <p class="text-[13px] text-muted">두 사람의 채팅방과 대화 내용이 삭제됩니다. 삭제한 대화는 복구할 수 없어요.</p>
          <div class="grid grid-cols-2 gap-2.5">
            <button type="button" id="cancel-delete-chat" class="h-12 rounded-xl bg-surface-muted text-sm font-bold text-ink">취소</button>
            <button type="button" id="confirm-delete-chat" class="h-12 rounded-xl bg-danger text-sm font-bold text-white disabled:opacity-60">삭제</button>
          </div>
        </div>
      `);
      document.getElementById("cancel-delete-chat").onclick = closeModal;
      const button = document.getElementById("confirm-delete-chat");
      button.onclick = async () => {
        button.disabled = true;
        try {
          await api.deleteChatroom(roomId, state.currentUser);
          if (button.isConnected) closeModal();
          if (state.screen === "chatroom" && state.activeChatroomId === roomId) navigate("chats");
          refreshChats();
          showToast("채팅방이 삭제되었어요.");
        } catch (error) {
          showToast(error.message, "error");
          button.disabled = false;
        }
      };
    }

    async function renderChatroomScreen(root) {
      const roomId = state.activeChatroomId;
      const userId = state.currentUser.user_id;
      root.innerHTML = `
        <div class="flex-1 flex items-center justify-center bg-white text-[13px] text-muted">
          채팅방에 연결하는 중...
        </div>
      `;
      const loading = root.firstElementChild;

      let roomData;
      try {
        roomData = await api.getChatMessages(roomId);
      } catch (err) {
        if (!loading.isConnected) return;
        showToast(err.message, "error");
        navigate("chats");
        return;
      }
      if (!loading.isConnected) return;

      let post = roomData.post;
      let latestReservation = roomData.latest_reservation;
      let messages = roomData.messages || [];

      // Resolve partnerId & partnerNickname reliably
      if (!state.activePartnerId || !state.activePartnerNickname) {
        try {
          const myRooms = await api.getChatrooms(userId);
          if (!loading.isConnected) return;
          const matched = myRooms.find((r) => r.chatroom_id === roomId);
          if (matched) {
            state.activePartnerId = matched.partner_id;
            state.activePartnerNickname = matched.partner_nickname;
          }
        } catch {
          // fallback below
        }
      }
      if (!loading.isConnected) return;

      if (!state.activePartnerNickname) {
        if (post && post.user_id !== state.currentUser.user_id) {
          state.activePartnerId = post.user_id;
          state.activePartnerNickname = post.seller_nickname;
        } else {
          const otherMsg = messages.find(
            (m) => m.user_id !== state.currentUser.user_id
          );
          if (otherMsg) {
            state.activePartnerId = otherMsg.user_id;
            state.activePartnerNickname = otherMsg.sender_nickname;
          } else {
            state.activePartnerNickname = "거래 이웃";
          }
        }
      }

      const partnerName = state.activePartnerNickname;

      const buildMessageBubbleHtml = (m) => {
        const isMine = m.user_id === state.currentUser.user_id;
        return isMine
          ? `
            <div data-msg-id="${m.message_id}" class="flex items-end justify-end gap-1.5">
              <span class="text-[10px] text-muted mb-1 flex-none">${formatChatTime(m.sent_at)}</span>
              <div class="max-w-[74%] px-3.5 py-2.5 rounded-[17px] bg-primary text-white text-[14px] leading-[20.3px] whitespace-pre-line break-words">${escapeHtml(m.content)}</div>
            </div>
          `
          : `
            <div data-msg-id="${m.message_id}" class="flex items-end justify-start gap-1.5">
              <div class="max-w-[74%] px-3.5 py-2.5 rounded-[17px] bg-surface-muted text-ink text-[14px] leading-[20.3px] whitespace-pre-line break-words">${escapeHtml(m.content)}</div>
              <span class="text-[10px] text-muted mb-1 flex-none">${formatChatTime(m.sent_at)}</span>
            </div>
          `;
      };

      const buildReservationCardHtml = () => {
        const res = latestReservation;
        if (!res) return "";
        const st = res.reservation_status;
        const isPending = st === "예약대기";
        const isConfirmed = st === "예약확정";
        const isCanceled = st === "예약취소";
        const isDone = st === "거래완료";

        const headerLabel = isPending
          ? "거래 약속이 제안되었어요"
          : isConfirmed
          ? "거래 약속이 확정되었어요"
          : isDone
          ? "거래가 완료되었어요"
          : "거래 약속이 취소되었어요";

        return `
          <div class="mt-2 flex flex-col gap-1.5">
            <div class="rounded-[17px] border ${
              isCanceled || isDone ? "border-border bg-surface-muted/50" : "border-primary bg-white"
            } overflow-hidden">
              <div class="p-4 flex flex-col gap-2">
                <div class="flex items-center gap-3">
                  <div class="w-[42px] h-[42px] rounded-[12px] ${
                    isCanceled || isDone ? "bg-border text-muted" : "bg-primary-soft text-primary"
                  } flex items-center justify-center flex-none">
                    <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="3" y="4" width="18" height="18" rx="3"/>
                      <path d="M16 2v4M8 2v4M3 10h18"/>
                    </svg>
                  </div>
                  <div class="flex flex-col">
                    <span class="text-[12px] font-bold ${isCanceled || isDone ? "text-muted" : "text-primary"}">${headerLabel}</span>
                    <span class="text-[17px] font-bold text-ink mt-0.5">${escapeHtml(formatReservationDate(res.reservation_at))}</span>
                  </div>
                </div>
                <span class="text-[13px] text-muted">${escapeHtml(post?.region_info || "")}</span>
              </div>

              ${
                isPending
                  ? `
                <div class="grid grid-cols-2 border-t border-border">
                  <button type="button" data-res-btn="예약취소" class="h-[48px] text-[14px] font-medium text-muted hover:bg-surface-muted transition-colors">취소</button>
                  <button type="button" data-res-btn="예약확정" class="h-[48px] text-[14px] font-bold text-white bg-primary hover:bg-primary-hover transition-colors">약속 확정</button>
                </div>
              `
                  : isConfirmed
                  ? `
                <div class="grid grid-cols-2 border-t border-border">
                  <button type="button" data-res-btn="예약취소" class="h-[46px] text-[13px] font-medium text-muted hover:bg-surface-muted transition-colors">예약 취소</button>
                  <button type="button" data-res-btn="거래완료" class="h-[46px] text-[13px] font-bold text-primary bg-primary-soft hover:bg-primary/15 transition-colors">거래 완료</button>
                </div>
              `
                  : `
                <div class="px-4 py-2.5 border-t border-border flex items-center justify-between">
                  <span class="text-[12px] font-bold ${isDone ? "text-primary" : "text-muted"}">${escapeHtml(st)}</span>
                  <span class="text-[11px] text-muted">${isCanceled && res.canceled_at ? formatRelativeTime(res.canceled_at) : ""}</span>
                </div>
              `
              }
            </div>
            ${
              isPending
                ? `<p class="text-center text-[11px] text-muted">확정하면 두 사람의 거래 약속으로 저장돼요.</p>`
                : ""
            }
          </div>
        `;
      };

      const statusLabel = () => [post?.neighborhood_name, chatConnectionLabel()].filter(Boolean).join(" · ");

      root.innerHTML = `
        <div class="flex-1 flex flex-col min-h-0 bg-white">
          <header class="flex-none h-[56px] px-4 flex items-center justify-between border-b border-border/70">
            <div class="flex items-center gap-2.5 min-w-0">
              <button type="button" id="chat-back-btn" aria-label="뒤로가기" class="p-1.5 -ml-1.5 rounded-[10px] hover:bg-surface-muted text-ink">
                <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M15 18l-6-6 6-6"/>
                </svg>
              </button>
              <div class="flex flex-col min-w-0">
                <span class="text-[17px] font-bold text-ink leading-tight truncate">${escapeHtml(partnerName)}</span>
                <span id="chat-ws-subtitle" class="text-[10px] text-muted mt-0.5">${escapeHtml(statusLabel())}</span>
              </div>
            </div>
            <button type="button" id="chat-menu-btn" aria-label="채팅 메뉴" class="p-2 rounded-[10px] hover:bg-surface-muted text-ink">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/>
              </svg>
            </button>
          </header>

          <!-- Product Summary Bar -->
          <div class="flex-none px-[18px] py-2.5 bg-white border-b border-border flex items-center justify-between gap-3">
            <div id="chat-product-link" class="cursor-pointer flex items-center gap-3 min-w-0">
              <div class="w-[48px] h-[48px] rounded-[12px] overflow-hidden flex-none border border-border">
                ${renderImageBox(post?.thumbnail, post?.post_title || "상품")}
              </div>
              <div class="flex flex-col min-w-0">
                <div class="flex items-center gap-1.5">
                  <span id="chat-post-status" class="text-[11px] font-bold flex-none ${
                    post?.status === "예약중" ? "text-reserved-text" : "text-primary"
                  }">${escapeHtml(post?.status || "판매중")}</span>
                  <span class="text-[12px] text-ink truncate">${escapeHtml(post?.post_title || "")}</span>
                </div>
                <span class="text-[15px] font-bold text-ink mt-0.5">${formatPrice(post?.price || 0)}</span>
              </div>
            </div>
            <button
              type="button"
              id="open-reserve-modal-btn"
              class="flex-none h-[34px] px-3 rounded-[9px] border border-input-border bg-white text-[12px] font-bold text-ink hover:border-primary hover:text-primary transition-colors"
            >예약하기</button>
          </div>

          <!-- Yellow Safety Banner -->
          <div class="flex-none h-[32px] px-5 bg-warn-bg text-warn-text text-[11px] flex items-center">
            선입금·외부 링크를 요구하면 신고해 주세요.
          </div>

          <!-- Scrollable Chat Messages + Reservation Card -->
          <div id="chat-scroll-area" class="flex-1 overflow-y-auto px-[18px] py-4 flex flex-col gap-3">
            <div class="flex justify-center">
              <span id="chat-date" class="px-3 py-1 rounded-full bg-surface-muted text-[11px] text-muted">
                ${formatChatDateDivider(messages[0]?.sent_at)}
              </span>
            </div>
            <div id="chat-msg-list" class="flex flex-col gap-2.5">
              ${messages.map(buildMessageBubbleHtml).join("")}
            </div>
            <div id="chat-reservation-slot">${buildReservationCardHtml()}</div>
          </div>

          <!-- Quick Reply Chips -->
          <div class="flex-none px-3.5 pt-2 pb-1 flex items-center gap-2 overflow-x-auto no-scrollbar bg-white">
            ${["네, 좋아요", "조금 늦을 것 같아요", "위치 보내기"]
              .map(
                (chip) => `
              <button
                type="button"
                data-quick-chip="${chip}"
                class="flex-none h-[29px] px-3 rounded-[15px] border border-border bg-white text-[11px] text-muted hover:border-primary hover:text-primary transition-colors"
              >${chip}</button>
            `
              )
              .join("")}
          </div>

          <!-- Bottom Input Bar -->
          <form id="chat-form" class="flex-none px-3.5 py-2.5 bg-white flex items-center gap-2 border-t border-border/50">
            <input
              id="chat-input"
              type="text"
              autocomplete="off"
              placeholder="메시지 보내기"
              class="flex-1 h-[42px] px-4 rounded-[21px] bg-surface-muted text-[13px] text-ink placeholder:text-muted focus:outline-none focus:ring-2 focus:ring-primary-soft"
            />
            <button
              type="submit"
              aria-label="전송"
              class="w-[40px] h-[40px] rounded-full bg-primary hover:bg-primary-hover active:scale-95 text-white flex items-center justify-center flex-none transition-all"
            >
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19V5M5 12l7-7 7 7"/>
              </svg>
            </button>
          </form>
        </div>
      `;

      const scrollToBottom = () => {
        const box = document.getElementById("chat-scroll-area");
        if (box) box.scrollTop = box.scrollHeight;
      };

      const view = root.firstElementChild;
      const scroll = view.querySelector("#chat-scroll-area");
      const messageList = view.querySelector("#chat-msg-list");
      const reservationSlot = view.querySelector("#chat-reservation-slot");
      const subtitle = view.querySelector("#chat-ws-subtitle");
      const postStatus = view.querySelector("#chat-post-status");
      let reservationBusy = false;
      let roomRequest = 0;

      const syncRoom = async (event = { type: "refresh" }) => {
        if (!view.isConnected) return;
        if (event.chatroom_id && event.chatroom_id !== roomId) return;
        if (event.type === "reservation" && event.post_id !== post?.post_id) return;
        if (event.type === "room_deleted") {
          navigate("chats");
          if (event.deleted_by !== userId) showToast("채팅방이 삭제되었어요.");
          return;
        }
        subtitle.textContent = statusLabel();
        const request = ++roomRequest;
        try {
          const fresh = await api.getChatMessages(roomId);
          if (!view.isConnected || request !== roomRequest) return;
          const nearBottom = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 48;
          const nextMessages = fresh.messages || [];
          const messagesChanged = messages.length !== nextMessages.length ||
            messages.some((message, index) => message.message_id !== nextMessages[index]?.message_id);
          if (messagesChanged) {
            messages = nextMessages;
            messageList.innerHTML = messages.map(buildMessageBubbleHtml).join("");
            view.querySelector("#chat-date").textContent = formatChatDateDivider(messages[0]?.sent_at);
          }
          const reservationChanged = JSON.stringify(latestReservation) !== JSON.stringify(fresh.latest_reservation);
          post = fresh.post;
          latestReservation = fresh.latest_reservation;
          if (reservationChanged) reservationSlot.innerHTML = buildReservationCardHtml();
          postStatus.textContent = post?.status || "판매중";
          postStatus.classList.toggle("text-reserved-text", post?.status === "예약중");
          postStatus.classList.toggle("text-primary", post?.status !== "예약중");
          if ((messagesChanged && nearBottom) || reservationChanged) scrollToBottom();
          if (!document.hidden) markChatRead(roomId, messages);
        } catch (error) {
          if (!view.isConnected || request !== roomRequest) return;
          if (error.status === 404) {
            navigate("chats");
            showToast(error.message);
          } else if (event.type === "manual") {
            showToast(error.message, "error");
          }
        }
      };

      reservationSlot.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-res-btn]");
        if (!button || !latestReservation || reservationBusy) return;
        reservationBusy = true;
        button.disabled = true;
        try {
          const result = await api.updateReservation(latestReservation.reservation_id, button.dataset.resBtn);
          await syncRoom();
          if (view.isConnected) showToast(result.message);
        } catch (error) {
          if (view.isConnected) showToast(error.message, "error");
        } finally {
          reservationBusy = false;
          button.disabled = false;
        }
      });

      syncOpenChat = syncRoom;
      if (!document.hidden) markChatRead(roomId, messages);
      scrollToBottom();
      syncRoom();

      const sendMessageText = async (rawText) => {
        const content = rawText.trim();
        if (!content) return true;
        try {
          await api.sendChatMessage(roomId, { user_id: userId, content });
          syncRoom();
          refreshChats();
          return true;
        } catch (error) {
          if (view.isConnected) showToast(error.message, "error");
          return false;
        }
      };

      document.getElementById("chat-back-btn").addEventListener("click", () => navigate("chats"));
      document.getElementById("chat-product-link").addEventListener("click", () => {
        if (post) navigate("detail", { postId: post.post_id });
      });

      document.getElementById("chat-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const input = document.getElementById("chat-input");
        const button = e.currentTarget.querySelector('button[type="submit"]');
        if (button.disabled) return;
        const text = input.value;
        input.value = "";
        button.disabled = true;
        if (!(await sendMessageText(text)) && !input.value) input.value = text;
        button.disabled = false;
      });

      root.querySelectorAll("[data-quick-chip]").forEach((btn) => {
        btn.addEventListener("click", () => sendMessageText(btn.dataset.quickChip));

                  class="w-full h-[46px] px-3.5 rounded-[12px] border border-input-border text-[14px] text-ink focus:outline-none focus:border-primary"

              <div class="p-3 rounded-[12px] bg-surface-muted text-[12px] text-muted">

              </div>

            <button type="button" id="submit-reservation-btn" class="w-full h-[52px] rounded-[14px] bg-primary hover:bg-primary-hover text-white text-[15px] font-bold">
              약속 제안 보내기

          </div>
        `);

        document.getElementById("close-res-modal").onclick = closeModal;
        const submit = document.getElementById("submit-reservation-btn");
        submit.onclick = async () => {
          const dateVal = document.getElementById("res-date-input").value || todayStr;
          const timeVal = document.getElementById("res-time-input").value || "19:00";
          const localDateTime = new Date(`${dateVal}T${timeVal}:00`);

              user_id: roomData.buyer_id,

        body.querySelectorAll("[data-sale-status]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const [postId, nextStatus] = btn.dataset.saleStatus.split(":");
            try {
              await api.updatePostStatus(Number(postId), nextStatus);
              showToast(`상태가 '${nextStatus}'(으)로 변경되었어요.`);
              renderMySalesScreen(root);
            } catch (err) {
              showToast(err.message, "error");
            }
          });
        });
      } catch (err) {
        body.innerHTML = `
          <div class="py-16 text-center">
            <p class="text-[14px] font-bold text-[#B91C1C]">판매 내역을 불러오지 못했어요</p>
            <p class="mt-1 text-[12px] text-muted">${escapeHtml(err.message)}</p>
          </div>
        `;
      }
    }

    /**
     * [09-2] 마이페이지 서브뷰: 예약 내역
     */
    async function renderMyReservationsScreen(root) {
      root.innerHTML = `
        <div class="flex-1 flex flex-col min-h-0 bg-white">
          <header class="flex-none h-[56px] px-4 flex items-center gap-2.5 border-b border-border">
            <button type="button" id="res-back-btn" aria-label="뒤로가기" class="p-1.5 -ml-1.5 rounded-[10px] hover:bg-surface-muted text-ink">
              <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6"/>
              </svg>
            </button>
            <h2 class="text-[19px] font-bold text-ink">예약 내역</h2>
          </header>
          <div id="res-body" class="flex-1 overflow-y-auto px-[18px] py-4 flex flex-col gap-3">
            <div class="py-16 text-center text-[13px] text-muted">예약 내역을 불러오는 중...</div>
          </div>
        </div>
      `;

      document.getElementById("res-back-btn").addEventListener("click", () => navigate("mypage"));

      const body = document.getElementById("res-body");
      try {
        const list = await api.getUserReservations(state.currentUser.user_id);

        if (list.length === 0) {
          body.innerHTML = `
            <div class="py-20 text-center">
              <p class="text-[15px] font-bold text-ink">예약된 거래가 없어요</p>
              <p class="mt-1 text-[12px] text-muted">1:1 채팅에서 거래 약속을 제안하고 확정해 보세요.</p>
            </div>
          `;
          return;
        }

        body.innerHTML = list
          .map((r) => {
            const st = r.reservation_status;
            const pillClass =
              st === "예약확정"
                ? "bg-reserved-bg text-reserved-text"
                : st === "예약취소"
                ? "bg-surface-muted text-muted"
                : "bg-primary-soft text-primary";
            const post = r.post;
            return `
              <div class="rounded-[14px] border border-border p-3.5 flex flex-col gap-3">
                <div class="flex items-center justify-between gap-2">
                  <span class="px-2 py-0.5 rounded-[6px] text-[11px] font-bold ${pillClass}">${escapeHtml(st)}</span>
                  <span class="text-[12px] font-bold text-primary">${escapeHtml(formatReservationDate(r.reservation_at))}</span>
                </div>
                ${
                  post
                    ? `
                  <div data-res-open-post="${post.post_id}" class="cursor-pointer flex items-stretch gap-3">
                    <div class="w-[74px] h-[74px] rounded-[12px] overflow-hidden flex-none border border-border/70">
                      ${renderImageBox(post.thumbnail, post.post_title)}
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col justify-between py-0.5">
                      <h3 class="text-[14px] font-medium text-ink truncate">${escapeHtml(post.post_title)}</h3>
                      <p class="text-[11px] text-muted">예약자: ${escapeHtml(r.buyer_nickname)} · ${escapeHtml(post.neighborhood_name)}</p>
                      <p class="text-[15px] font-bold text-ink">${formatPrice(post.price)}</p>
                    </div>
                  </div>
                `
                    : ""
                }
                ${
                  st === "예약대기" || st === "예약확정"
                    ? `
                  <div class="grid grid-cols-2 gap-2 pt-2.5 border-t border-border">
                    <button type="button" data-res-act="${r.reservation_id}:예약취소" class="h-[36px] rounded-[10px] bg-surface-muted text-[12px] font-bold text-muted hover:text-ink">
                      예약 취소
                    </button>
                    <button type="button" data-res-act="${r.reservation_id}:${
                        st === "예약대기" ? "예약확정" : "거래완료"
                      }" class="h-[36px] rounded-[10px] bg-primary text-[12px] font-bold text-white hover:bg-primary-hover">
                      ${st === "예약대기" ? "약속 확정" : "거래 완료"}
                    </button>
                  </div>
                `
                    : ""
                }
              </div>
            `;
          })
          .join("");

        body.querySelectorAll("[data-res-open-post]").forEach((el) => {
          el.addEventListener("click", () =>
            navigate("detail", { postId: Number(el.dataset.resOpenPost) })
          );
        });

        body.querySelectorAll("[data-res-act]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const [resId, nextStatus] = btn.dataset.resAct.split(":");
            try {
              const res = await api.updateReservation(Number(resId), nextStatus);
              showToast(res.message || `${nextStatus} 처리되었어요.`);
              renderMyReservationsScreen(root);
            } catch (err) {
              showToast(err.message, "error");
            }
          });
        });
      } catch (err) {
        body.innerHTML = `
          <div class="py-16 text-center">
            <p class="text-[14px] font-bold text-[#B91C1C]">예약 내역을 불러오지 못했어요</p>
            <p class="mt-1 text-[12px] text-muted">${escapeHtml(err.message)}</p>
          </div>
        `;
      }
    }

    /* =========================================================================
       9. MAIN ROUTER & BOOTSTRAP
       ========================================================================= */
    async function renderApp() {
      const root = document.getElementById("screen-root");
      try {
        if (!state.currentUser && state.screen !== "auth") {
          state.screen = "auth";
        }
        switch (state.screen) {
          case "auth":
            renderAuthScreen(root);
            break;
          case "verify":
            await renderVerifyScreen(root);
            break;
          case "home":
            await renderHomeScreen(root);
            break;
          case "create":
            renderCreateScreen(root);
            break;
          case "detail":
            await renderDetailScreen(root);
            break;
          case "chats":
            await renderChatsScreen(root);
            break;
          case "chatroom":
            await renderChatroomScreen(root);
            break;
          case "wishlist":
            await renderWishlistScreen(root);
            break;
          case "mypage":
            renderMypageScreen(root);
            break;
          case "my_sales":
            await renderMySalesScreen(root);
            break;
          case "my_reservations":
            await renderMyReservationsScreen(root);
            break;
          default:
            renderAuthScreen(root);
        }
        renderBottomNav();
      } catch (err) {
        console.error("Render error:", err);
        showToast("화면을 불러오는 중 문제가 발생했어요.", "error");
      }
    }

    window.addEventListener("DOMContentLoaded", async () => {
      if (state.currentUser) {
        // Refresh user profile from real backend if running locally
        if (!USE_MOCK) {
          try {
            const fresh = await api.getUser(state.currentUser.user_id);
            state.currentUser = { ...fresh, chat_session: state.currentUser.chat_session };
            saveSessionUser(state.currentUser);
          } catch {
            // If DB was reset or user no longer exists, clear stale session
            state.currentUser = null;
            saveSessionUser(null);
          }
        }
        state.screen = state.currentUser
          ? state.currentUser.is_verified
            ? "home"
            : "verify"
          : "auth";
      } else {
        state.screen = "auth";
      }
      renderApp();
      pollChatUpdates();
      setInterval(pollChatUpdates, 4000);
      window.addEventListener("focus", () => {
        lastChatSync = 0;
        pollChatUpdates();
      });
    });
  </script>
</body>
</html>
